<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="150" r="180" fill="#0284C7" opacity="0.25" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="220" fill="#10B981" opacity="0.2" filter="url(#glow)" />

  <!-- Grid Decoration -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Center Card -->
  <rect x="120" y="85" width="960" height="460" rx="28" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Medical Icon -->
  <g transform="translate(180, 150)">
    <rect width="90" height="90" rx="22" fill="url(#accentGrad)" />
    <path d="M45 22 L45 68 M22 45 L68 45" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <circle cx="45" cy="45" r="28" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.4" />
  </g>

  <!-- Brand Title -->
  <text x="295" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Readex Pro', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.02em">ClinicFlow</text>
  <text x="295" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Readex Pro', sans-serif" font-size="24" font-weight="700" fill="#38BDF8">منظومة إدارة العيادات والمراكز الطبية الذكية</text>

  <!-- Headline & Subtitle -->
  <text x="180" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Readex Pro', sans-serif" font-size="34" font-weight="800" fill="#F8FAFC">
    نظام الجيل القادم لإدارة المواعيد، سجلات المرضى، والفوترة السحابية
  </text>
  
  <text x="180" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Readex Pro', sans-serif" font-size="22" font-weight="500" fill="#94A3B8">
    بوابة حجز رقمية بالهاتف • تذاكر QR ذكية • عزل سحابي كامل لكل عيادة عبر PostgreSQL RLS
  </text>

  <!-- Feature Badges -->
  <g transform="translate(180, 435)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="46" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="24" cy="23" r="6" fill="#10B981" />
    <text x="40" y="29" font-family="sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">عزل تام للمستأجرين</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="230" height="46" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="264" cy="23" r="6" fill="#38BDF8" />
    <text x="280" y="29" font-family="sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">حجز فوري بالهاتف</text>

    <!-- Badge 3 -->
    <rect x="490" y="0" width="230" height="46" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <circle cx="514" cy="23" r="6" fill="#F59E0B" />
    <text x="530" y="29" font-family="sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">نطاقات مخصصة SSL</text>
  </g>
</svg>
